<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>הרפתקת המתמטיקה - מיינקראפט כיתה ג'</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --mc-grass: #55aa55;
            --mc-grass-dark: #3b7a3b;
            --mc-dirt: #8b5a2b;
            --mc-dirt-dark: #5c3a1a;
            --mc-stone: #8a8a8a;
            --mc-stone-dark: #585858;
            --mc-wood: #b8864b;
            --mc-wood-dark: #7a5429;
            --mc-diamond: #4deeea;
            --mc-emerald: #17dd62;
            --mc-gold: #ffd700;
            --mc-ui-bg: #c6c6c6;
            --mc-ui-border-light: #ffffff;
            --mc-ui-border-dark: #555555;
        }

        body {
            font-family: 'Rubik', sans-serif;
            background-color: #2b2b2b;
            background-image: 
                linear-gradient(45deg, rgba(0,0,0,0.15) 25%, transparent 25%), 
                linear-gradient(-45deg, rgba(0,0,0,0.15) 25%, transparent 25%), 
                linear-gradient(45deg, transparent 75%, rgba(0,0,0,0.15) 75%), 
                linear-gradient(-45deg, transparent 75%, rgba(0,0,0,0.15) 75%);
            background-size: 32px 32px;
            background-position: 0 0, 0 16px, 16px -16px, -16px 0;
            user-select: none;
            overflow-x: hidden;
        }

        /* Minecraft Blocky UI Panel */
        .mc-panel {
            background-color: var(--mc-ui-bg);
            border: 4px solid #1e1e1e;
            box-shadow: 
                inset 4px 4px 0px var(--mc-ui-border-light),
                inset -4px -4px 0px var(--mc-ui-border-dark),
                0 8px 0 rgba(0,0,0,0.4);
            border-radius: 6px;
        }

        .mc-panel-dark {
            background-color: #373737;
            border: 4px solid #1a1a1a;
            box-shadow: 
                inset 4px 4px 0px #525252,
                inset -4px -4px 0px #222222;
            color: #ffffff;
            border-radius: 6px;
        }

        /* Minecraft 3D Pixel Buttons */
        .mc-btn {
            position: relative;
            background-color: #7d7d7d;
            color: white;
            font-weight: 700;
            text-shadow: 2px 2px 0px #222222;
            border: 3px solid #1e1e1e;
            box-shadow: 
                inset 3px 3px 0px rgba(255,255,255,0.45),
                inset -3px -3px 0px rgba(0,0,0,0.45),
                0 4px 0 #1e1e1e;
            transition: transform 0.08s ease, filter 0.1s ease;
            border-radius: 4px;
            cursor: pointer;
        }

        .mc-btn:hover:not(:disabled) {
            filter: brightness(1.1);
        }

        .mc-btn:active:not(:disabled) {
            transform: translateY(3px);
            box-shadow: 
                inset 3px 3px 0px rgba(255,255,255,0.3),
                inset -3px -3px 0px rgba(0,0,0,0.5),
                0 1px 0 #1e1e1e;
        }

        .mc-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .mc-btn-green { background-color: #4aa02c; }
        .mc-btn-gold { background-color: #d4a017; }
        .mc-btn-diamond { background-color: #20b2aa; }
        .mc-btn-red { background-color: #c9302c; }
        .mc-btn-blue { background-color: #337ab7; }

        /* Minecraft Input Slot */
        .mc-slot {
            background-color: #8b8b8b;
            border: 3px solid #1e1e1e;
            box-shadow: 
                inset 3px 3px 0px #373737,
                inset -3px -3px 0px #ffffff;
            color: #ffffff;
            font-weight: 800;
            text-shadow: 2px 2px 0px #222222;
            border-radius: 4px;
            text-align: center;
            outline: none;
            transition: background-color 0.2s;
        }

        .mc-slot:focus {
            background-color: #9e9e9e;
            box-shadow: 
                inset 3px 3px 0px #222222,
                inset -3px -3px 0px #ffd700,
                0 0 0 3px #ffd700;
        }

        .mc-slot.correct {
            background-color: #3b8c3b !important;
            box-shadow: inset 3px 3px 0px #1e4d1e, inset -3px -3px 0px #70db70 !important;
        }

        .mc-slot.wrong {
            background-color: #a83232 !important;
            box-shadow: inset 3px 3px 0px #591616, inset -3px -3px 0px #ff7575 !important;
        }

        /* Grass Top Banner */
        .grass-header {
            background: linear-gradient(to bottom, #55aa55 0%, #55aa55 70%, #8b5a2b 70%, #8b5a2b 100%);
            border-bottom: 4px solid #3a2310;
        }

        /* XP Bar */
        .xp-bar-container {
            background-color: #1e1e1e;
            border: 3px solid #000000;
            height: 20px;
            border-radius: 4px;
            overflow: hidden;
            position: relative;
        }

        .xp-bar-fill {
            background: linear-gradient(to bottom, #80ff20 0%, #45b300 100%);
            height: 100%;
            transition: width 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: inset 0 2px 0 rgba(255,255,255,0.5);
        }

        /* Animations */
        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-60px) scale(1.3); }
        }

        .xp-particle {
            position: fixed;
            pointer-events: none;
            font-weight: 900;
            color: #80ff20;
            text-shadow: 2px 2px 0 #000;
            animation: floatUp 1s ease-out forwards;
            z-index: 9999;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-8px); }
            40%, 80% { transform: translateX(8px); }
        }

        .animate-shake {
            animation: shake 0.4s ease-in-out;
        }

        @keyframes bounceBlock {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }

        .animate-block {
            animation: bounceBlock 2s infinite ease-in-out;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 10px; }
        ::-webkit-scrollbar-track { background: #2b2b2b; }
        ::-webkit-scrollbar-thumb { background: #666; border: 2px solid #222; }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between text-gray-900">

    <script>
        /* ==========================================================================
           1. WEB AUDIO API SYNTHESIZER (8-Bit / Minecraft Sound Effects)
           ========================================================================== */
        let audioCtx = null;
        let isMuted = false;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function toggleSound() {
            isMuted = !isMuted;
            const btn = document.getElementById('btn-sound');
            btn.textContent = isMuted ? '🔇' : '🔊';
            if (!isMuted) {
                initAudio();
                playSound('click');
            }
        }

        function playSound(type) {
            if (isMuted) return;
            try {
                initAudio();
                const now = audioCtx.currentTime;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);

                if (type === 'click') {
                    // Block tap / UI click
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(320, now);
                    osc.frequency.exponentialRampToValueAtTime(160, now + 0.06);
                    gain.gain.setValueAtTime(0.15, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.06);
                    osc.start(now);
                    osc.stop(now + 0.06);
                } else if (type === 'xp') {
                    // Classic XP Orb high chime
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(880, now);
                    osc.frequency.setValueAtTime(1318.5, now + 0.08);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.35);
                    osc.start(now);
                    osc.stop(now + 0.35);
                } else if (type === 'wrong') {
                    // Minecraft damage / anvil thud
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(140, now);
                    osc.frequency.linearRampToValueAtTime(75, now + 0.25);
                    gain.gain.setValueAtTime(0.25, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
                    osc.start(now);
                    osc.stop(now + 0.25);
                } else if (type === 'hint') {
                    // Potion / Enchantment sparkle
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(523.25, now);
                    osc.frequency.setValueAtTime(659.25, now + 0.07);
                    osc.frequency.setValueAtTime(783.99, now + 0.14);
                    gain.gain.setValueAtTime(0.18, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                    osc.start(now);
                    osc.stop(now + 0.3);
                } else if (type === 'levelup') {
                    // Level up fanfare
                    const notes = [523.25, 659.25, 783.99, 1046.50];
                    notes.forEach((freq, idx) => {
                        const o = audioCtx.createOscillator();
                        const g = audioCtx.createGain();
                        o.type = 'square';
                        o.connect(g);
                        g.connect(audioCtx.destination);
                        o.frequency.setValueAtTime(freq, now + idx * 0.1);
                        g.gain.setValueAtTime(0.15, now + idx * 0.1);
                        g.gain.exponentialRampToValueAtTime(0.01, now + idx * 0.1 + 0.25);
                        o.start(now + idx * 0.1);
                        o.stop(now + idx * 0.1 + 0.25);
                    });
                }
            } catch (e) {
                console.warn('Audio playback skipped:', e);
            }
        }

        function spawnXPParticles(text = '+100 XP 💎') {
            const el = document.createElement('div');
            el.className = 'xp-particle text-xl sm:text-2xl';
            el.textContent = text;
            el.style.left = (40 + Math.random() * 20) + 'vw';
            el.style.top = '45vh';
            document.body.appendChild(el);
            setTimeout(() => el.remove(), 1000);
        }

        /* ==========================================================================

                explanation: '83 עשרות שוות ל־830 (83 × 10 = 830). כשמוסיפים 6 יחידות מקבלים: 830 + 6 = <strong>836</strong>! (לעומת זאת, 83 מאות זה 8,300).'

            {

            },
            // Q4: סדרות וקפיצות שוות
            {
                id: 4,
                world: 'עולם המספרים 🟩',
                blockIcon: '🟨',
                title: 'שאלה 4: גשר הקפיצות השוות',
                subtitle: 'השלמת סדרות (דף 1, תרגיל 4)',

                    </ul>
                `
            },
            // Q5: הרכבת מספרים תלת-ספרתיים מהספרות 0, 4, 7
            {
                id: 5,
                world: 'עולם המספרים 🟩',

        /* ==========================================================================
           3. NAVIGATION & HUD UPDATES
           ========================================================================== */
        function updateHUD() {
            document.getElementById('hud-avatar').textContent = state.character.icon;
            document.getElementById('hud-score').textContent = state.score;
            const level = Math.floor(state.xp / 300) + 1;
            document.getElementById('hud-level').textContent = level;
            document.getElementById('hud-xp-text').textContent = `${state.xp} XP`;

            const xpWrapper = document.getElementById('hud-xp-wrapper');
            const homeBtn = document.getElementById('btn-home');

            if (state.activeQuestions.length > 0 && state.currentIndex < state.activeQuestions.length) {
                xpWrapper.classList.remove('hidden');
                homeBtn.classList.remove('hidden');
                const q = state.activeQuestions[state.currentIndex];
                document.getElementById('hud-world-name').textContent = q.world;
                document.getElementById('hud-progress-text').textContent = `שאלה ${state.currentIndex + 1} מתוך ${state.activeQuestions.length}`;
                const pct = ((state.currentIndex) / state.activeQuestions.length) * 100;
                document.getElementById('xp-bar-fill').style.width = `${pct}%`;
            } else {
                xpWrapper.classList.add('hidden');
                if (state.activeQuestions.length === 0) {
                    homeBtn.classList.add('hidden');
                    document.getElementById('hud-world-name').textContent = 'בחרו עולם והתחילו לשחק!';
                }
            }
        }

        function goHome() {
            playSound('click');
            state.activeQuestions = [];
            state.currentIndex = 0;
            renderStartScreen();
        }

        function startGame(worldFilter = 'all') {
            playSound('levelup');
            state.mode = worldFilter;
            if (worldFilter === 'all') {
                state.activeQuestions = [...questionsBank];
            } else {
                state.activeQuestions = questionsBank.filter(q => q.world.includes(worldFilter));
            }
            state.currentIndex = 0;
            state.score = 0;
            state.xp = 0;
            state.results = [];
            renderQuestion();
        }

        function selectCharacter(charId) {
            playSound('click');
            const found = characters.find(c => c.id === charId);
            if (found) {
                state.character = found;
                renderStartScreen();
            }
        }

                { id: '0,2', x: 25, y: 125 }, { id: '1,2', x: 75, y: 125 }, { id: '2,2', x: 125, y: 125 }
            ];
            const vertex = { x: 25, y: 75 }; // (0,1)
            const givenEnd = { x: 75, y: 25 }; // (1,0)
            const chosenId = tempSelections.grids[gridNum];
            const chosenPt = coords.find(c => c.id === chosenId);

            container.innerHTML = `
                <svg viewBox="0 0 150 150" class="w-36 h-36 cursor-pointer">
                    <!-- Given Ray -->
                    <line x1="${vertex.x}" y1="${vertex.y}" x2="${givenEnd.x}" y2="${givenEnd.y}" stroke="#111" stroke-width="4" stroke-linecap="round"/>
                    
                    <!-- User Drawn Ray -->
                    ${chosenPt ? `
                        <line x1="${vertex.x}" y1="${vertex.y}" x2="${chosenPt.x}" y2="${chosenPt.y}" stroke="#2563eb" stroke-width="4" stroke-linecap="round"/>
                    ` : ''}

                    <!-- Dots -->
                    ${coords.map(pt => {
                        const isVertex = pt.id === '0,1';
                        const isGivenEnd = pt.id === '1,0';
                        const isChosen = pt.id === chosenId;
                        const clickable = !isVertex && !isGivenEnd;
                        return `
                            <circle cx="${pt.x}" cy="${pt.y}" r="${isVertex ? 7 : (isChosen ? 7 : 5.5)}"
                                fill="${isVertex ? '#ef4444' : (isChosen ? '#2563eb' : '#111')}"
                                ${clickable ? `onclick="clickGridDot(${gridNum}, '${pt.id}')"` : ''}
                            />
                            ${clickable ? `<circle cx="${pt.x}" cy="${pt.y}" r="14" fill="transparent" onclick="clickGridDot(${gridNum}, '${pt.id}')"/>` : ''}
                        `;
                    }).join('')}
                </svg>
            `;
        }

        function clickGridDot(gridNum, dotId) {
            if (state.answeredCurrent) return;
            playSound('click');
            tempSelections.grids[gridNum] = dotId;
            renderSingleGrid(gridNum);
        }

        /* ==========================================================================
           7. ANSWER VALIDATION & FEEDBACK
           ========================================================================== */
        function checkAnswer() {
            if (state.answeredCurrent) return;
            const q = state.activeQuestions[state.currentIndex];
            let isCorrect = false;

            if (q.type === 'q1_682') {
                const a = Number(document.getElementById('q1_a').value);
                const b = Number(document.getElementById('q1_b').value);
                const c = Number(document.getElementById('q1_c').value);
                const validC = [628, 268, 286];
                const okA = a === 692;
                const okB = b === 582;
                const okC = validC.includes(c);
                markInput('q1_a', okA);
                markInput('q1_b', okB);
                markInput('q1_c', okC);
                isCorrect = okA && okB && okC;
            } else if (q.type === 'mcq') {
                if (!tempSelections.mcq) return showTempAlert('אנא בחרו אחת מהתשובות!');
                const chosenObj = q.options.find(o => o.id === tempSelections.mcq);
                isCorrect = chosenObj && chosenObj.correct;
            } else if (q.type === 'compare') {
                if (!tempSelections.compare) return showTempAlert('אנא לחצו על אחד הסימנים: < , = או >');
                isCorrect = tempSelections.compare === q.correctSign;
            } else if (q.type === 'q4_sequences') {
                const a1 = Number(document.getElementById('q4_a1').value);
                const a2 = Number(document.getElementById('q4_a2').value);
                const a3 = Number(document.getElementById('q4_a3').value);
                const b1 = Number(document.getElementById('q4_b1').value);
                const b2 = Number(document.getElementById('q4_b2').value);
                const b3 = Number(document.getElementById('q4_b3').value);

                const oka1 = a1 === 456, oka2 = a2 === 466, oka3 = a3 === 476;
                const okb1 = b1 === 600, okb2 = b2 === 520, okb3 = b3 === 500;
                markInput('q4_a1', oka1); markInput('q4_a2', oka2); markInput('q4_a3', oka3);
                markInput('q4_b1', okb1); markInput('q4_b2', okb2); markInput('q4_b3', okb3);
                isCorrect = oka1 && oka2 && oka3 && okb1 && okb2 && okb3;
            } else if (q.type === 'q5_digits') {
                const vals = [1, 2, 3, 4].map(i => Number(document.getElementById(`q5_${i}`).value));
                const validSet = [407, 470, 704, 740];
                const unique = new Set(vals);
                let allValid = true;
                vals.forEach((v, idx) => {
                    const ok = validSet.includes(v);
                    markInput(`q5_${idx + 1}`, ok);
                    if (!ok) allValid = false;
                });
                isCorrect = allValid && unique.size === 4;
            } else if (q.type === 'q6_calc') {
                const answers = { c1: 578, c2: 1113, c3: 360, c4: 614, c5: 48 };
                let allOk = true;
                for (const [key, expected] of Object.entries(answers)) {
                    const val = Number(document.getElementById(`q6_${key}`).value);
                    const ok = val === expected;
                    markInput(`q6_${key}`, ok);
                    if (!ok) allOk = false;
                }
                isCorrect = allOk;
            } else if (q.type === 'q7_unknowns') {
                const answers = { 1: 7, 2: 5, 3: 152, 4: 300, 5: 54 };
                let allOk = true;
                for (const [key, expected] of Object.entries(answers)) {
                    const val = Number(document.getElementById(`q7_${key}`).value);
                    const ok = val === expected;
                    markInput(`q7_${key}`, ok);
                    if (!ok) allOk = false;
                }
                isCorrect = allOk;
            } else if (q.type === 'q8_stickers') {
                if (!tempSelections.q8Op) return showTempAlert('אנא בחרו קודם את התרגיל המתאים!');
                const total = Number(document.getElementById('q8_total').value);
                const okOp = tempSelections.q8Op === 'mult';
                const okTot = total === 96;
                markInput('q8_total', okTot);
                isCorrect = okOp && okTot;
            } else if (q.type === 'q9_cookies') {
                if (!tempSelections.q9Op) return showTempAlert('אנא בחרו קודם את התרגיל המתאים!');
                const bags = Number(document.getElementById('q9_bags').value);
                const okOp = tempSelections.q9Op === 'div';
                const okBags = bags === 6;
                markInput('q9_bags', okBags);
                isCorrect = okOp && okBags;
            } else if (q.type === 'q10_mult_compare') {
                if (!tempSelections.q10_1 || !tempSelections.q10_2) return showTempAlert('אנא השלימו את שני הסימנים!');
                isCorrect = tempSelections.q10_1 === '=' && tempSelections.q10_2 === '>';
            } else if (q.type === 'q11_chart') {
                const a = Number(document.getElementById('q11_a').value);
                const b = Number(document.getElementById('q11_b').value);
                const okA = a === 8;
                const okB = b === 24;
                markInput('q11_a', okA);
                markInput('q11_b', okB);
                isCorrect = okA && okB;
            } else if (q.type === 'q12_angles_compare') {
                if (!tempSelections.q12) return showTempAlert('אנא לחצו על הזווית הגדולה ביותר!');
                isCorrect = tempSelections.q12 === 3;
            } else if (q.type === 'q13_angle_grid') {
                const g = tempSelections.grids;
                if (!g[1] || !g[2] || !g[3]) return showTempAlert('אנא בחרו נקודה בכל אחת משלוש המסגרות!');
                // Given ray is vector (1, -1) [45 deg up-right]
                // Acute (< 90 deg): '0,0' (45 deg), '1,1' (45 deg), '2,1' (26.5 deg), '2,0' (18.4 deg)
                // Right (= 90 deg): '1,2' (vector (1, 1) -> dot product 1*1 + (-1)*1 = 0!)
                // Obtuse (> 90 deg): '0,2' (vector (0, 1) -> 135 deg)
                const acuteValid = ['0,0', '1,1', '2,1', '2,0'];
                const obtuseValid = ['0,2'];
                const rightValid = ['1,2'];
                isCorrect = acuteValid.includes(g[1]) && obtuseValid.includes(g[2]) && rightValid.includes(g[3]);
            } else if (q.type === 'q14_ruler') {
                const len = Number(document.getElementById('q14_len').value);
                const okLen = len === 6;
                markInput('q14_len', okLen);
                isCorrect = okLen;
            }

            // Lock question & show result
            state.answeredCurrent = true;
            state.results.push({ id: q.id, title: q.title, correct: isCorrect });

            const feedbackBox = document.getElementById('feedback-box');
            const feedbackHeader = document.getElementById('feedback-header');
            feedbackBox.classList.remove('hidden');

            if (isCorrect) {
                playSound('xp');
                spawnXPParticles('+100 XP 💎');
                state.score += 1;
                state.xp += 100;
                feedbackBox.classList.add('bg-emerald-200', 'border-emerald-700');
                feedbackHeader.innerHTML = `<span class="text-2xl">🎉</span> <span class="text-emerald-900">כל הכבוד ${state.character.name}! תשובה מדויקת! (+1 אמרלד)</span>`;
            } else {
                playSound('wrong');
                document.getElementById('question-card').classList.add('animate-shake');
                state.xp += 25; // Effort XP
                feedbackBox.classList.add('bg-red-200', 'border-red-700');
                feedbackHeader.innerHTML = `<span class="text-2xl">💥</span> <span class="text-red-900">כמעט! בואו נלמד מההסבר למטה ונמשיך הלאה:</span>`;
            }

            updateHUD();
            document.getElementById('btn-check').classList.add('hidden');
            const nextBtn = document.getElementById('btn-next');
            nextBtn.classList.remove('hidden');
            if (state.currentIndex === state.activeQuestions.length - 1) {
                nextBtn.innerHTML = '🏆 סיום הרפתקה וצפייה בפרסים!';
            }
        }

        function markInput(id, isOk) {
            const el = document.getElementById(id);
            if (!el) return;
            el.disabled = true;
            el.classList.add(isOk ? 'correct' : 'wrong');
        }

        function showTempAlert(msg) {
            playSound('wrong');
            const existing = document.getElementById('temp-toast');
            if (existing) existing.remove();
            const toast = document.createElement('div');
            toast.id = 'temp-toast';
            toast.className = 'fixed bottom-6 left-1/2 -translate-x-1/2 bg-red-600 text-white font-bold px-5 py-3 rounded border-4 border-black shadow-xl z-50 text-sm sm:text-base';
            toast.textContent = '⚠️ ' + msg;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 2500);
        }

        function nextQuestion() {
            playSound('click');
            state.currentIndex++;
            if (state.currentIndex < state.activeQuestions.length) {
                renderQuestion();
            } else {
                renderSummaryScreen();
            }
        }

        /* ==========================================================================
           8. SUMMARY / VICTORY SCREEN
           ========================================================================== */
        function renderSummaryScreen() {
            playSound('levelup');
            document.getElementById('xp-bar-fill').style.width = '100%';
            document.getElementById('hud-world-name').textContent = 'המשימה הושלמה בהצלחה!';
            const total = state.activeQuestions.length;
            const correctCount = state.results.filter(r => r.correct).length;
            const pct = Math.round((correctCount / total) * 100);

            let rankTitle = 'חוצב מתחיל 🪨';
            let rankBadge = '🥉';
            if (pct >= 90) { rankTitle = 'מאסטר יהלומים ואמרלדים! 💎'; rankBadge = '👑'; }
            else if (pct >= 70) { rankTitle = 'אביר זהב מנוסה! ⚔️'; rankBadge = '🥇'; }
            else if (pct >= 50) { rankTitle = 'חוקר ברזל אמיץ! 🛡️'; rankBadge = '🥈'; }

            const container = document.getElementById('game-container');
            container.innerHTML = `
                <div class="mc-panel p-6 sm:p-8 text-center space-y-6">
                    <div class="text-5xl sm:text-6xl animate-block">${rankBadge}</div>
                    <div class="space-y-1">
                        <h2 class="text-2xl sm:text-4xl font-black text-gray-900">כל הכבוד, ${state.character.name}!</h2>
                        <p class="text-lg sm:text-xl font-bold text-emerald-800">הדרגה שלך: ${rankTitle}</p>
                    </div>

                    <!-- Stats Summary Cards -->
                    <div class="grid grid-cols-3 gap-3">
                        <div class="mc-panel-dark p-3">
                            <div class="text-xs text-gray-300">תשובות נכונות</div>
                            <div class="text-2xl sm:text-3xl font-black text-emerald-400">${correctCount} / ${total}</div>
                        </div>
                        <div class="mc-panel-dark p-3">
                            <div class="text-xs text-gray-300">אמרלדים 💎</div>
                            <div class="text-2xl sm:text-3xl font-black text-cyan-300">${state.score}</div>
                        </div>
                        <div class="mc-panel-dark p-3">
                            <div class="text-xs text-gray-300">נקודות ניסיון</div>
                            <div class="text-2xl sm:text-3xl font-black text-lime-400">${state.xp} XP</div>
                        </div>
                    </div>

                    <!-- Breakdown List -->
                    <div class="text-right bg-white/80 rounded border-4 border-gray-500 p-4 max-h-60 overflow-y-auto space-y-2">
                        <h3 class="font-extrabold text-gray-800 border-b-2 border-gray-300 pb-1">סיכום השאלות שתרגלת:</h3>
                        ${state.results.map(r => `
                            <div class="flex items-center justify-between text-sm py-1 border-b border-gray-200">
                                <span class="font-semibold text-gray-800">${r.title}</span>
                                <span class="font-bold ${r.correct ? 'text-emerald-700' : 'text-red-600'}">
                                    ${r.correct ? '✔️ הצלחה' : '🔄 כדאי לתרגל שוב'}
                                </span>
                            </div>
                        `).join('')}
                    </div>

                    <div class="flex flex-wrap justify-center gap-4 pt-2">
                        <button onclick="startGame(state.mode)" class="mc-btn mc-btn-green px-6 py-3.5 text-lg">
                            🔄 שחק שוב באותו שלב
                        </button>
                        <button onclick="goHome()" class="mc-btn mc-btn-gold px-6 py-3.5 text-lg">
                            🏠 חזרה למסך העולמות
                        </button>
                    </div>
                </div>
            `;
        }

        // Start App on Window Load
        window.onload = function() {
            renderStartScreen();
        };
    </script>
</body>
</html>
